# Convenience wrapper: `docker compose up --build` builds the image and serves
# the data-gov-ie MCP server over streamable HTTP at http://127.0.0.1:8000/mcp.
services:
  data-gov-ie:
    build: .
    image: data-gov-ie-mcp
    ports:
      - "8000:8000"
    environment:
      # Transport/bind are baked into the image; override here if needed.
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      DATA_GOV_IE_LOG_FILE: /dev/stderr
      # Point at another CKAN instance/mirror without rebuilding:
      # DATA_GOV_IE_BASE_URL: https://data.gov.ie
    restart: unless-stopped
