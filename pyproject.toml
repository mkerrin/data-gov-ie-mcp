[project]
name = "data-gov-ie-mcp"
version = "0.1.0"
description = "MCP server exposing the data.gov.ie (CKAN) open-data API as tools for Claude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
data-gov-ie-mcp = "data_gov_ie_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_gov_ie_mcp"]
